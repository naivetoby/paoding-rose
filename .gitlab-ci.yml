stages:
  - release

variables:
  MAVEN_CLI_OPTS: "-s ci_settings.xml --batch-mode -U"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2/repository"

cache:
  key: maven-ci-cache
  paths:
    - .m2/repository/

release:
  stage: release
  image: git.fewper.com:5050/docker-image/maven-amazoncorretto21:latest
  script:
    - mvn $MAVEN_CLI_OPTS clean
    - mvn $MAVEN_CLI_OPTS deploy -Dmaven.test.skip=true -DaltDeploymentRepository=gitlab-maven::default::https://git.fewper.com/api/v4/projects/${CI_PROJECT_ID}/packages/maven
  only:
    - main
  tags:
    - library-runner
